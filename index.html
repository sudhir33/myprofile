<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri Satya Sudhir Reddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#F6F5FB;--bg2:#FFFFFF;--card:#FFFFFF;--ink:#1A1D33;--muted:#5E6487;--line:#E3E3F0;
  --a1:#4F46E5;--a2:#C2771B;--a3:#0E9F8E;--on-a1:#FFFFFF;--glow:.18;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020;--bg2:#121A33;--card:#141C38;--ink:#EEF1FA;--muted:#9AA3C2;--line:#253056;
  --a1:#8B97FF;--a2:#F2B66D;--a3:#4FD1C5;--on-a1:#0B1020;--glow:.30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1020;--bg2:#121A33;--card:#141C38;--ink:#EEF1FA;--muted:#9AA3C2;--line:#253056;--a1:#8B97FF;--a2:#F2B66D;--a3:#4FD1C5;--on-a1:#0B1020;--glow:.30;color-scheme:dark}
/* Themes chosen in the editor */
:root[data-skin="midnight"]{--bg:#0B1020;--bg2:#121A33;--card:#141C38;--ink:#EEF1FA;--muted:#9AA3C2;--line:#253056;--a1:#8B97FF;--a2:#F2B66D;--a3:#4FD1C5;--on-a1:#0B1020;--glow:.30;color-scheme:dark}
:root[data-skin="pearl"]{--bg:#F6F5FB;--bg2:#FFFFFF;--card:#FFFFFF;--ink:#1A1D33;--muted:#5E6487;--line:#E3E3F0;--a1:#4F46E5;--a2:#C2771B;--a3:#0E9F8E;--on-a1:#FFFFFF;--glow:.18;color-scheme:light}
:root[data-skin="ocean"]{--bg:#061B20;--bg2:#0B272E;--card:#0E2F37;--ink:#E6F4F3;--muted:#8DB3B2;--line:#1D4750;--a1:#3CC6B4;--a2:#F4C27A;--a3:#7FB2FF;--on-a1:#061B20;--glow:.28;color-scheme:dark}
:root[data-skin="blossom"]{--bg:#FBF5F3;--bg2:#FFFFFF;--card:#FFFFFF;--ink:#2B1E24;--muted:#7A6670;--line:#EEDFE0;--a1:#C2416B;--a2:#B7791F;--a3:#6D5BD0;--on-a1:#FFFFFF;--glow:.16;color-scheme:light}
:root[data-skin="forest"]{--bg:#0E1A14;--bg2:#13241B;--card:#172B21;--ink:#ECF3EE;--muted:#9DB5A6;--line:#28443A;--a1:#7BD389;--a2:#E9C46A;--a3:#9AD1F0;--on-a1:#0E1A14;--glow:.26;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--a1);outline-offset:3px;border-radius:6px}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.nav-in{display:flex;align-items:center;gap:18px;height:64px}
.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--on-a1);font-weight:700;text-decoration:none;flex:none}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.links::-webkit-scrollbar{display:none}
.links a{text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:600;padding:8px 12px;border-radius:999px;white-space:nowrap}
.links a:hover{color:var(--ink);background:color-mix(in srgb,var(--a1) 10%,transparent)}

/* hero */
.hero{position:relative;overflow:hidden;padding:72px 0 64px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--glow);pointer-events:none}
.hero::before{width:520px;height:520px;background:var(--a1);top:-160px;left:-120px}
.hero::after{width:460px;height:460px;background:var(--a3);bottom:-200px;right:-100px}
.hero-grid{position:relative;display:grid;gap:44px;align-items:center}

.hello{font-weight:600;color:var(--a2);margin:0 0 10px}
.name{font-size:clamp(2.7rem,7.4vw,5.2rem);line-height:1.02;margin:0;letter-spacing:-.01em;background:linear-gradient(115deg,var(--ink) 30%,var(--a1) 75%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.rot{margin:16px 0 0;font-size:clamp(1.05rem,2.4vw,1.35rem);font-weight:600;min-height:1.6em}
.rot span{display:inline-block;transition:opacity .35s,transform .35s}
.rot span.out{opacity:0;transform:translateY(8px)}
.intro{margin:14px 0 0;color:var(--muted);font-size:1.08rem;max-width:56ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:700;font-size:.95rem;text-decoration:none;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--a1)}
.btn.fill{background:var(--a1);border-color:var(--a1);color:var(--on-a1)}
.btn.fill:hover{filter:brightness(1.08)}
.portrait{justify-self:center;position:relative;width:min(300px,70vw);aspect-ratio:1}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--a1),var(--a3),var(--a2),var(--a1));animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.portrait img,.portrait .ph{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);border-radius:50%;object-fit:cover;border:7px solid var(--bg);background:var(--card)}
.portrait .ph{display:grid;place-items:center;font-size:4rem;color:var(--muted)}
.badge-loc{position:absolute;bottom:6%;left:-6%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:600;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);white-space:nowrap}
.stats{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:56px}
.stat{background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.stat b{display:block;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:2.3rem;line-height:1.1;color:var(--a2)}
.stat span{color:var(--muted);font-size:.88rem}

/* sections */
section.s{padding:72px 0}
section.s.alt{background:var(--bg2);border-block:1px solid var(--line)}
.s-head{margin-bottom:32px;max-width:60ch}
.s-head h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(2rem,4.4vw,2.8rem);line-height:1.1;margin:0}
.s-head p{color:var(--muted);margin:8px 0 0}

.about-grid{display:grid;gap:34px;align-items:start}
@media (min-width:900px){.about-grid{grid-template-columns:1.45fr 1fr;gap:48px}}
.about-text p{margin:0 0 18px;font-size:1.08rem;line-height:1.85;text-align:justify;text-justify:inter-word;-webkit-hyphens:auto;hyphens:auto;color:var(--ink)}
.about-text p+p{color:color-mix(in srgb,var(--ink) 82%,var(--muted))}
.about-text p:first-child::first-letter{font-family:"DM Serif Display",Georgia,serif;float:left;font-size:4.6rem;line-height:.82;padding:8px 12px 0 0;color:var(--a2)}
.quote{position:relative;margin:30px 0 0;padding:30px 30px 24px 34px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 14%,var(--card)),color-mix(in srgb,var(--a3) 10%,var(--card)));border:1px solid var(--line)}
.quote::before{content:"“";position:absolute;top:-34px;left:20px;font-family:"DM Serif Display",Georgia,serif;font-size:7rem;line-height:1;color:var(--a2)}
.quote p{margin:0;font-family:"DM Serif Display",Georgia,serif;font-size:clamp(1.3rem,2.6vw,1.6rem);line-height:1.35}
.quote cite{display:block;margin-top:12px;font-style:normal;font-size:.85rem;color:var(--muted);font-weight:700}
.glance{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px 22px;box-shadow:0 24px 50px -36px var(--a1)}
.glance-h{display:flex;align-items:center;gap:10px;padding:16px 0 6px;font-weight:700}
.glance-h::after{content:"";flex:1;height:1px;background:var(--line)}
.fact{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .fi{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--c1) 15%,var(--card))}
.fact small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.fact b{font-size:.96rem;line-height:1.35}
.edu{display:grid;gap:12px;margin-top:16px}
.edu-card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.edu-card .yr{flex:none;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--a2) 16%,var(--card));color:var(--a2)}
.edu-card b{display:block}
.edu-card small{color:var(--muted)}
.mini-h{font-weight:700;margin:0 0 12px;font-size:1rem}
.sub-h{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(1.6rem,3.4vw,2rem);margin:56px 0 18px}
.approach{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.ap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;overflow:hidden}
.ap::after{content:"";position:absolute;right:-40px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--c1) 26%,transparent),transparent 70%)}
.ap .ai{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:1.45rem;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,var(--card)),color-mix(in srgb,var(--c2) 16%,var(--card)))}
.ap h4{margin:14px 0 6px;font-size:1.06rem}
.ap p{margin:0;color:var(--muted);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.84rem;font-weight:600;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--a1) 10%,var(--card));border:1px solid color-mix(in srgb,var(--a1) 22%,var(--line));color:var(--ink)}
.chip.alt{background:color-mix(in srgb,var(--a3) 10%,var(--card));border-color:color-mix(in srgb,var(--a3) 25%,var(--line))}
.strengths{margin-top:34px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.strengths .lbl{font-weight:700;margin-right:6px}

/* journey */
.journey{position:relative;display:grid;gap:18px;padding-left:28px}
.journey::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--a1),var(--a3),transparent)}
.job{position:relative;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;cursor:pointer;display:grid;gap:4px;transition:border-color .2s,transform .2s}
.job::before{content:"";position:absolute;left:-26px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--a1)}
.job:first-child::before{background:var(--a1);box-shadow:0 0 0 6px color-mix(in srgb,var(--a1) 22%,transparent)}
.job:hover{border-color:var(--a1);transform:translateX(4px)}
.job .when{font-size:.82rem;font-weight:700;color:var(--a2)}
.job h3{margin:0;font-size:1.2rem}
.job .org{color:var(--muted);font-size:.93rem}
.job .more{margin-top:6px;font-size:.86rem;font-weight:700;color:var(--a1)}

/* projects */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.proj{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,border-color .25s}
.proj:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c1) 50%,var(--line));box-shadow:0 24px 50px -24px color-mix(in srgb,var(--c1) 60%,transparent)}
.cover{height:150px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,color-mix(in srgb,var(--c1) 85%,transparent),transparent 60%),radial-gradient(circle at 80% 90%,color-mix(in srgb,var(--c2) 80%,transparent),transparent 60%),color-mix(in srgb,var(--c1) 25%,var(--bg2))}
.cover .ico{font-size:3.4rem;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.cover .num{position:absolute;top:12px;right:14px;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.proj-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.proj-body h3{margin:0;font-size:1.12rem;line-height:1.3}
.proj-body p{margin:0;color:var(--muted);font-size:.93rem}
.proj-body .chips{margin-top:auto;padding-top:8px}
.proj-body .chip{font-size:.74rem;padding:4px 10px}
.open{font-size:.86rem;font-weight:700;color:var(--a1);margin-top:4px}

/* what I do */
.role-switch{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.rs{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:10px 18px 10px 10px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.rs:hover{border-color:var(--a1)}
.rs .ri{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:1.35rem;background:color-mix(in srgb,var(--a1) 14%,var(--card))}
.rs b{display:block;font-size:.98rem;line-height:1.25}
.rs small{color:var(--muted);font-size:.78rem;font-weight:600}
.rs[aria-selected="true"]{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 13%,var(--card));box-shadow:0 14px 30px -18px var(--a1)}
.role-hero{position:relative;overflow:hidden;border-radius:28px;padding:34px clamp(22px,4vw,44px);margin-bottom:18px;color:var(--on-a1);background:radial-gradient(500px 260px at 100% 0%,color-mix(in srgb,var(--a2) 55%,transparent),transparent 70%),linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 45%,var(--a3)))}
.role-hero .big-ico{position:absolute;right:clamp(14px,4vw,40px);bottom:-18px;font-size:clamp(5rem,14vw,8.5rem);opacity:.28;pointer-events:none}
.role-hero h3{position:relative;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(1.9rem,4.4vw,2.7rem);line-height:1.1;margin:0;max-width:20ch}
.role-hero p{position:relative;margin:12px 0 0;font-size:1.06rem;max-width:58ch;opacity:.92}
.role-hero .cnt{position:relative;display:inline-block;margin-top:18px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.82rem;background:color-mix(in srgb,var(--on-a1) 16%,transparent)}
.duties{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(265px,1fr))}
.duty{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:8px;align-content:start;transition:transform .2s,border-color .2s,box-shadow .2s}
.duty:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c1) 60%,var(--line));box-shadow:0 20px 40px -26px var(--c1)}
.duty .di{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:1.4rem;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 32%,var(--card)),color-mix(in srgb,var(--c2) 18%,var(--card)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 35%,transparent)}
.duty h4{margin:6px 0 0;font-size:1.04rem;line-height:1.3}
.duty p{margin:0;color:var(--muted);font-size:.92rem}
.duty.plain p{color:var(--ink);font-size:.96rem}

/* skills */
.skillband{position:relative;overflow:hidden;background:radial-gradient(760px 420px at 100% 0%,color-mix(in srgb,var(--a3) 18%,transparent),transparent 70%),radial-gradient(700px 420px at 0% 100%,color-mix(in srgb,var(--a1) 16%,transparent),transparent 70%),var(--bg2);border-block:1px solid var(--line)}
.ticker{overflow:hidden;margin:0 0 40px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker-track{display:flex;align-items:center;gap:22px;width:max-content;animation:tick 55s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(1.5rem,3.4vw,2.2rem);white-space:nowrap;color:var(--ink);opacity:.85}
.ticker-track i{font-style:normal;color:var(--a2);font-size:1rem}
@keyframes tick{to{transform:translateX(-50%)}}
.spot-title{font-weight:700;margin:0 0 14px}
.spot{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));margin-bottom:34px}
.sp{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 12px 16px;text-align:center;display:grid;justify-items:center;gap:12px;transition:transform .2s,border-color .2s}
.sp:hover{transform:translateY(-4px);border-color:var(--c1)}
.sp .sym{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 16px 30px -14px var(--c1)}
.sp b{font-size:.9rem;line-height:1.3}
.sgroups{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media (min-width:900px){.sgroups{grid-template-columns:1fr 1fr}}
.sg{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}
.sg::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.sg-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sg-head .gi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:1.45rem;background:color-mix(in srgb,var(--c1) 18%,var(--card))}
.sg-head h3{margin:0;font-size:1.2rem}
.sg-head small{color:var(--muted);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;font-weight:600;font-size:.88rem;background:color-mix(in srgb,var(--c1) 8%,var(--bg));border:1px solid color-mix(in srgb,var(--c1) 24%,var(--line))}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c1);flex:none}

/* recognition */
.recog{position:relative;overflow:hidden;background:radial-gradient(800px 420px at 12% 0%,color-mix(in srgb,var(--a2) 20%,transparent),transparent 70%),radial-gradient(700px 420px at 100% 100%,color-mix(in srgb,var(--a1) 16%,transparent),transparent 70%),var(--bg2);border-block:1px solid var(--line)}
.recog .s-head{margin:0 auto 40px;text-align:center}
.recog .s-head p{font-size:1.05rem}
.ach-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));grid-auto-flow:dense}
@media (min-width:900px){.ach-grid{grid-template-columns:repeat(6,1fr)}.ach{grid-column:span 2}.ach.big{grid-column:span 3}}
.ach{position:relative;overflow:hidden;border-radius:24px;padding:26px 26px 24px;border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a2),color-mix(in srgb,var(--a2) 8%,var(--line)) 45%,color-mix(in srgb,var(--a1) 70%,var(--line))) border-box}

const DUTY_ICONS=[[/video/i,"🎥"],[/mentor|guid/i,"🧭"],[/resume|portfolio|linkedin/i,"📄"],[/interview/i,"🎤"],[/analytic|metric|monitor/i,"📊"],[/assess|test|evaluat/i,"📝"],[/certif/i,"🎓"],[/platform|coding|leetcode|hackerrank/i,"💻"],[/recruit|placement/i,"🤝"],[/feedback|improv/i,"🔁"],[/target|goal/i,"🎯"],[/schedul|resource|alloc/i,"🗓️"],[/\bai\b|emerging|innovat/i,"🤖"],[/roadmap|plan/i,"🗺️"],[/team|leader|trainer/i,"👥"],[/curricul|module|training|program|teach|course/i,"📚"],[/workshop|seminar|bootcamp/i,"🛠️"]];
function dutyIcon(title,text){for(const s of [title,text])if(s)for(const [re,ic] of DUTY_ICONS)if(re.test(s))return ic;return"✦"}
function parseDuty(b){const m=String(b).match(/^\*\*(.+?)\*\*\s*[:\-–]?\s*(.*)$/);if(m)return{title:m[1].replace(/[:\s]+$/,""),text:m[2]};return{title:"",text:String(b)}}

/* ---------- awards ---------- */
const ISSUER={anthropic:"#C2593A",claude:"#C2593A",hackerrank:"#1BA94C",leetcode:"#E8890C",ibm:"#0F62FE",cisco:"#0587C4",nptel:"#B23A48",microsoft:"#0078D4",postman:"#F2602B",servicenow:"#2E7D5B","great learning":"#3B5BDB",kaggle:"#1497D4",atlassian:"#0052CC",mongodb:"#00845A",coursera:"#0056D2",google:"#3C7CF0",aws:"#E08A00",udemy:"#8A3FFC",infosys:"#007CC3"};
function issuerColor(n){const k=String(n||"").toLowerCase().trim();for(const key in ISSUER)if(k.includes(key))return ISSUER[key];let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 45%)`}
const MONO={anthropic:"A\\",microsoft:"MS",servicenow:"NOW",postman:"PM",cisco:"CISCO",kaggle:"K",mongodb:"MDB",atlassian:"ATL","great learning":"GL",leetcode:"LC",hackerrank:"HR"};
function mono(n){n=String(n||"").trim();{const k=n.toLowerCase();for(const key in MONO)if(k.includes(key))return MONO[key]}if(!n)return"★";if(/^[A-Z0-9]{2,4}$/.test(n))return n;const caps=n.replace(/[^A-Z]/g,"");if(caps.length>=2&&caps.length<=3)return caps;const w=n.split(/\s+/);return (w.length>1?w[0][0]+w[1][0]:n.slice(0,2)).toUpperCase()}
let certFilter="All";
function certCard(c,cls){const u=safeUrl(c.link);const tag=u?"a":"div";const attrs=u?` href="${esc(u)}" target="_blank" rel="noopener"`:"";
  const meta=[c.issuer,c.year].filter(Boolean).map(esc).join(", ");
  return cls==="fcard"?`<${tag} class="fcard" style="--h:${issuerColor(c.issuer)}"${attrs}><span class="hex">${esc(mono(c.issuer))}</span><div><b>${esc(c.name)}</b><small>${meta}</small></div><span class="star">★ Featured</span></${tag}>`
  :`<${tag} class="tile" style="--h:${issuerColor(c.issuer)}"${attrs}><span class="hex">${esc(mono(c.issuer))}</span><b>${esc(c.name)}</b><small>${meta}</small></${tag}>`}
function awardsHTML(d){
  const ach=(d.achievements||[]).filter(a=>a.title);
  const certs=(d.certifications||[]).filter(c=>c.name);
  if(!ach.length&&!certs.length)return"";
  const counts={};certs.forEach(c=>{const k=c.issuer||"Other";counts[k]=(counts[k]||0)+1});
  const issuers=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(certFilter!=="All"&&!counts[certFilter])certFilter="All";
  const featured=certs.filter(c=>c.featured);
  const list=certFilter==="All"?certs.filter(c=>!c.featured):certs.filter(c=>(c.issuer||"Other")===certFilter);
  const limit=18,shown=certsAll||certFilter!=="All"?list:list.slice(0,limit);
  return `<section class="s recog" id="awards"><div class="wrap">
    <div class="s-head"><h2>Awards and achievements</h2><p>Recognition earned for placements, teaching and training excellence.</p></div>
    ${ach.length?`<div class="ach-grid">${ach.map(a=>{const big=/^[\d₹$+]/.test(String(a.title).trim());return `<div class="ach${big?" big":""}"><span class="medal">${esc(a.icon||"🏆")}</span><div class="txt"><h3>${esc(a.title)}</h3>${a.subtitle?`<p class="sub">${esc(a.subtitle)}</p>`:""}${a.detail?`<p class="det">${rich(a.detail)}</p>`:""}${a.year?`<span class="yr">${esc(a.year)}</span>`:""}</div></div>`}).join("")}</div>`:""}
    ${certs.length?`<div class="cert-head"><div><h3>Certifications and badges</h3><p>Credentials from industry and academic platforms.</p></div>
      <div class="counters"><div class="counter"><b>${certs.length}</b><span>Credentials</span></div><div class="counter"><b>${issuers.length}</b><span>Issuers</span></div></div></div>
      ${featured.length?`<div class="feat">${featured.map(c=>certCard(c,"fcard")).join("")}</div>`:""}
      ${issuers.length>1?`<div class="filters" role="group" aria-label="Filter by issuer"><button type="button" class="filter" data-filter="All" aria-pressed="${certFilter==="All"}">All<i>${certs.length}</i></button>${issuers.map(k=>`<button type="button" class="filter" data-filter="${esc(k)}" aria-pressed="${certFilter===k}">${esc(k)}<i>${counts[k]}</i></button>`).join("")}</div>`:""}
      <div class="wall">${shown.map(c=>certCard(c,"tile")).join("")}</div>
      ${certFilter==="All"&&list.length>limit?`<div class="wall-more"><button type="button" class="btn" id="certToggle">${certsAll?"Show fewer":"Show all "+list.length}</button></div>`:""}`:""}
  </div></section>`;
}

let saveT,renderT;
function changed(){
  $("#status").textContent="Saving…";
  clearTimeout(saveT);saveT=setTimeout(()=>{data._saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(data));$("#status").textContent=LIVE?"Draft saved. Click Publish changes to update the live page.":"Saved in this browser."}catch(e){$("#status").textContent="Couldn’t save in this browser. Use Download page to keep your changes."}},400);
  clearTimeout(renderT);renderT=setTimeout(render,150);
}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function rows(t){t.rows=Math.max(3,Math.min(14,t.value.split("\n").length+1))}
function field(label,type,obj,key,onIn){
  if(type==="photo")return photoField(obj,key);
  if(type==="check"){const w=el("label","fld");w.style.cssText="display:flex;align-items:center;gap:10px";const c=el("input");c.type="checkbox";c.checked=!!obj[key];c.style.cssText="width:18px;height:18px;accent-color:var(--a1)";c.onchange=()=>{obj[key]=c.checked;onIn&&onIn();changed()};const sp=el("span",null,label);sp.style.cssText="font-size:.88rem;font-weight:600;color:var(--ink)";w.append(c,sp);return w}
  const w=el("label","fld");w.appendChild(el("span",null,label));let inp;
  if(type==="text"){inp=el("input");inp.type="text";inp.value=obj[key]||"";inp.oninput=()=>{obj[key]=inp.value;onIn&&onIn();changed()}}
  else if(type==="textarea"){inp=el("textarea");inp.rows=4;inp.value=obj[key]||"";inp.oninput=()=>{obj[key]=inp.value;changed()}}
  else{inp=el("textarea");inp.value=(obj[key]||[]).join("\n");rows(inp);inp.oninput=()=>{obj[key]=inp.value.split("\n");rows(inp);onIn&&onIn();changed()}}
  w.appendChild(inp);return w;
}
function photoField(obj,key){
  const w=el("div","fld");w.appendChild(el("span",null,"Photo"));const row=el("div","ph-row");
  const draw=()=>{row.innerHTML="";
    if(obj[key]){const im=el("img");im.src=obj[key];im.alt="";row.appendChild(im)}else row.appendChild(el("div","e"));
    const up=el("label","sbtn file","Upload photo");const f=el("input");f.type="file";f.accept="image/*";up.appendChild(f);row.appendChild(up);
    f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,480/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);obj[key]=c.toDataURL("image/jpeg",.88);draw();changed()};img.src=rd.result};rd.readAsDataURL(file)};
    if(obj[key]){const rm=el("button","sbtn","Remove");rm.type="button";rm.onclick=()=>{obj[key]="";draw();changed()};row.appendChild(rm)}};
  draw();w.appendChild(row);return w;
}
function countText(s){const v=data[s.key];if(s.type==="list")return `${v.length}`;if(s.type==="lines")return `${clean(v).length}`;return ""}
function fill(s,body,cnt){
  body.innerHTML="";
  if(s.type==="theme"){
    const g=el("div","swatches");
    THEMES.forEach(([id,name,bg])=>{const b=el("button","sw");b.type="button";b.setAttribute("aria-pressed",String((data.theme||"auto")===id));const i=el("i");i.style.background=bg;b.append(i,document.createTextNode(name));b.onclick=()=>{data.theme=id;applyTheme();fill(s,body,cnt);changed()};g.appendChild(b)});
    body.appendChild(g);body.appendChild(el("p","hint","Auto follows your device’s light or dark setting."));return}
  if(s.type==="group"){s.fields.forEach(([k,l,t])=>body.appendChild(field(l,t,data[s.key],k)));return}
  if(s.type==="lines"){body.appendChild(field(s.label,"lines",data,s.key,()=>cnt.textContent=countText(s)));return}
  if(!Array.isArray(data[s.key]))data[s.key]=[];
  const arr=data[s.key];
  arr.forEach((item,i)=>{
    const card=el("div","item"),h=el("div","item-head"),t=el("strong",null,s.label(item));h.appendChild(t);
    const mk=(tx,lab,fn,dis,cls)=>{const b=el("button","ib"+(cls?" "+cls:""),tx);b.type="button";b.title=lab;b.setAttribute("aria-label",lab);b.disabled=!!dis;b.onclick=fn;h.appendChild(b)};
    mk("↑","Move up",()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];fill(s,body,cnt);changed()},i===0);
    mk("↓","Move down",()=>{[arr[i+1],arr[i]]=[arr[i],arr[i+1]];fill(s,body,cnt);changed()},i===arr.length-1);
    mk("🗑","Delete",()=>{if(confirm(`Delete “${s.label(item).trim()}”?`)){arr.splice(i,1);fill(s,body,cnt);cnt.textContent=countText(s);changed()}},false,"del");
    card.appendChild(h);
    s.fields.forEach(([k,l,ty])=>card.appendChild(field(l,ty,item,k,()=>t.textContent=s.label(item))));
    body.appendChild(card);
  });
  const add=el("button","add",`+ Add ${s.noun}`);add.type="button";
  add.onclick=()=>{arr.push(s.blank());fill(s,body,cnt);cnt.textContent=countText(s);changed();const items=body.querySelectorAll(".item");const last=items[items.length-1];if(last){last.scrollIntoView({block:"center"});const f=last.querySelectorAll("input")[s.key==="projects"?1:0];f&&f.focus()}};
  body.appendChild(add);
}
function buildEditor(){
  const ed=$("#editor");ed.innerHTML="";
  const pwSec=()=>{const d=el("details","ed-sec");d.appendChild(el("summary",null,"Password"));const b=el("div","ed-body");
    b.appendChild(el("p","hint","Change the password needed to open this editor."));
    const mk=l=>{const w=el("label","fld");w.appendChild(el("span",null,l));const i=el("input");i.type="password";i.autocomplete="new-password";w.appendChild(i);b.appendChild(w);return i};
    const a=mk("New password"),c=mk("Confirm new password");const msg=el("p","hint");const btn=el("button","sbtn fill","Change password");btn.type="button";
    btn.onclick=()=>{if(a.value.length<4){msg.textContent="Use at least 4 characters.";return}if(a.value!==c.value){msg.textContent="The two passwords don’t match.";return}
      data.passHash=pwHash(a.value);setUnlocked(true);a.value=c.value="";changed();msg.textContent=LIVE?"Password changed. Click Publish changes to apply it.":"Password changed. Download the page to keep the new password in your file."};
    b.append(btn,msg);d.appendChild(b);return d};
  SCHEMA.forEach(s=>{const d=el("details","ed-sec");if(s.open)d.open=true;const sm=el("summary",null,s.title);const c=el("span","count",countText(s));sm.appendChild(c);d.appendChild(sm);const b=el("div","ed-body");d.appendChild(b);fill(s,b,c);ed.appendChild(d)});
  ed.appendChild(pwSec());
}
function pwHash(pw){let s="sudhir-profile:"+pw,h=0x811c9dc5;for(let r=0;r<200;r++){for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}s=h.toString(16)+pw}return h.toString(16)}
const UNLOCK="sudhir-profile-unlocked";
function isUnlocked(){try{return sessionStorage.getItem(UNLOCK)===data.passHash}catch(e){return false}}
function setUnlocked(v){try{v?sessionStorage.setItem(UNLOCK,data.passHash):sessionStorage.removeItem(UNLOCK)}catch(e){}}
function requestEdit(){if(LIVE&&!CAN_EDIT)return;if(isUnlocked())return openEditor();$("#lockPw").value="";$("#lockErr").textContent="";$("#lock").showModal();setTimeout(()=>$("#lockPw").focus(),30)}
$("#lockForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#lockPw").value;
  if(pwHash(v)===data.passHash){setUnlocked(true);$("#lock").close();openEditor()}
  else{$("#lockErr").textContent=v?"That password isn’t correct. Try again.":"Type the password to continue.";const f=$("#lockForm");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");$("#lockPw").select()}});
$("#lockCancel").onclick=()=>{$("#lock").close();$("#fab").focus()};
$("#lockNow").onclick=()=>{setUnlocked(false);closeEditor()};
function openEditor(){if(!isUnlocked())return requestEdit();document.body.classList.add("editing");setTimeout(()=>$("#done").focus(),50)}
function closeEditor(){document.body.classList.remove("editing");$("#fab").focus()}
$("#fab").onclick=requestEdit;$("#done").onclick=closeEditor;$("#scrim").onclick=closeEditor;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("editing")&&!$("#modal").open)closeEditor()});
$("#reset").onclick=()=>{if(confirm("Reset the page to its original content? Your changes will be lost.")){const ph=data.passHash;data=normalize(clone(SEED));data.passHash=ph;try{localStorage.removeItem(KEY)}catch(e){}applyTheme();buildEditor();render();$("#status").textContent="Reset to original."}};
function buildHTML(){
  const css=document.getElementById("css").textContent,js=document.getElementById("main").textContent;
  const seed=JSON.stringify(data).replace(/</g,"\\u003c");
  return `<!DOCTYPE html>\n<html lang="en">\n<head>\n${HEAD}<title>${esc(data.profile.name||"Profile")}</title>\n<style id="css">${css}</style>\n</head>\n<body>\n<script type="application/json" id="seed">${seed}<\/script>\n<script id="main">${js}<\/script>\n</body>\n</html>\n`;
}
/* ---------- live (shared link) mode ---------- */
let ART=null,LIVE=false,CAN_EDIT=true,dirty=false;
function setStatus(s){$("#status").textContent=s}
async function initLive(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{ART=await window.claude.use("artifact")}catch(e){ART=null}
  if(!ART)return;
  LIVE=true;
  let u=null;try{u=await window.claude.use("user")}catch(e){}
  CAN_EDIT=u?await u.canEdit():false;
  $("#dl").hidden=true;
  if(!CAN_EDIT){
    $("#fab").hidden=true;
    data=normalize(clone(SEED));applyTheme();render();return;
  }
  $("#pub").hidden=false;
  $("#dnote").textContent="Add, change, reorder or delete anything. Put one item per line in list boxes, and wrap words in **double stars** to make them bold. When you’re done, click “Publish changes” so everyone who opens your link sees the update.";
  if(JSON.stringify({...data,_saved:0})!==JSON.stringify({...normalize(clone(SEED)),_saved:0})){dirty=true;setStatus("You have unpublished changes. Click Publish changes to update the live page.")}
}
async function publishLive(){
  if(!ART)return;const b=$("#pub");b.disabled=true;b.textContent="Publishing…";setStatus("Publishing your changes…");
  data._saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
  try{await ART.publish(buildHTML());setStatus("Published. Everyone with the link now sees this version.");dirty=false}
  catch(e){const c=e&&e.code;
    if(c==="conflict")setStatus("A newer version was just published. Loading it now…");
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"){setStatus("This view can’t publish. Open the page from your own Claude account to publish.");b.hidden=true}
    else if(c==="too_large")setStatus("The page is too large to publish. Remove or replace some large photos and try again.");
    else if(c==="rate_limited")setStatus("Publishing too often. Wait a minute, then publish again.");
    else setStatus("Couldn’t publish just now. Please try again.");
  }
  b.disabled=false;b.textContent="🌐 Publish changes";
}
$("#pub").onclick=publishLive;
$("#dl").onclick=()=>{
  data._saved=Date.now();
  const html=buildHTML();
  try{const blob=new Blob([html],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(String(data.profile.name||"profile").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"profile")+".html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);$("#status").textContent="Downloaded. Open the new file to see your updated page."}
  catch(e){$("#status").textContent="Download isn’t available here. Open the downloaded HTML file in your browser and try again."}
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{});

applyTheme();buildEditor();render();
initLive();
